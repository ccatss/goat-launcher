name: Release GoAT Launcher

on:
  push:
    tags:
      - 'v*' # Triggers on version tags, e.g., v1.0.0

permissions:
  contents: write

jobs:
  build-desktop:
    name: Build ${{ matrix.job_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goarch: amd64
            job_name: Linux amd64
            artifact_name: goat-launcher-linux-amd64
          - os: ubuntu-latest
            goarch: arm64
            job_name: Linux arm64
            artifact_name: goat-launcher-linux-arm64
          - os: windows-latest
            goarch: amd64
            job_name: Windows amd64
            artifact_name: goat-launcher-windows-amd64.exe
          - os: macos-14 # Apple Silicon runner
            goarch: arm64
            job_name: macOS arm64
            artifact_name: goat-launcher-darwin-arm64
          - os: macos-13 # Intel runner
            goarch: amd64
            job_name: macOS amd64
            artifact_name: goat-launcher-darwin-amd64

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      # --- Linux Platform Dependencies ---
      - name: Install Linux Graphics Headers
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev xorg-dev

      - name: Configure Linux Cross-Compiler
        if: matrix.os == 'ubuntu-latest' && matrix.goarch == 'arm64'
        run: |
         sudo dpkg --add-architecture arm64
            
         sudo sed -i 's/deb http/deb [arch=amd64,i386] http/g' /etc/apt/sources.list
         if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
           sudo sed -i 's/Types: deb/Types: deb\nArchitectures: amd64 i386/g' /etc/apt/sources.list.d/ubuntu.sources
         fi
            
         CODENAME=$(lsb_release -cs)
         sudo tee /etc/apt/sources.list.d/arm64-ports.list <<EOF
         deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports/ ${CODENAME} main restricted universe
         deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports/ ${CODENAME}-updates main restricted universe
         deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports/ ${CODENAME}-security main restricted universe
         EOF
            
         sudo apt-get update
         sudo apt-get install -y gcc-aarch64-linux-gnu libgl1-mesa-dev:arm64 xorg-dev:arm64
         echo "CC=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      # --- Compilation Step ---
      - name: Build Binary
        env:
          GOOS: ${{ matrix.os == 'windows-latest' && 'windows' || (matrix.os == 'ubuntu-latest' && 'linux' || 'darwin') }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 1
        run: |
          go build -ldflags="-s -w" -o build_output/${{ matrix.artifact_name }} ./cmd

      # --- macOS Specific Bundle Packaging ---
      # Fyne binaries on macOS need to be packaged into a .app structure to execute correctly.
      - name: Package macOS App Bundle
        if: startsWith(matrix.os, 'macos-')
        run: |
          go install fyne.io/tools/cmd/fyne@latest
          # Use Fyne tool to turn the raw binary into a proper app package
          fyne package -os darwin -executable build_output/${{ matrix.artifact_name }}
          zip -r build_output/${{ matrix.artifact_name }}.app.zip GoAT\ Launcher.app

      # --- Upload Intermediate Artifacts ---
      - name: Upload Temporary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            build_output/${{ matrix.artifact_name }}*
            !build_output/*.app # Don't upload the raw unpacked mac folder

  create-release:
    name: Create GitHub Release
    needs: build-desktop
    runs-on: ubuntu-latest
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Display Downloaded Files
        run: ls -R dist/

      - name: Publish Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/goat-launcher-linux-amd64
            dist/goat-launcher-linux-arm64
            dist/goat-launcher-windows-amd64.exe
            dist/goat-launcher-darwin-amd64.app.zip
            dist/goat-launcher-darwin-arm64.app.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}